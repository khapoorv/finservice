name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push analytics
        uses: docker/build-push-action@v5
        with:
          context: ./analytics
          push: true
          tags: ghcr.io/${{ github.repository }}/analytics:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Update deployment image
        run: |
          kubectl set image deployment/fincommerce-backend \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          kubectl set image deployment/fincommerce-analytics \
            analytics=ghcr.io/${{ github.repository }}/analytics:${{ github.sha }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/fincommerce-backend --timeout=120s
          kubectl rollout status deployment/fincommerce-analytics --timeout=120s
